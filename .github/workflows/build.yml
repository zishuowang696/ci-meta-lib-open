name: Build Yocto Image

on:
  push:
    branches:
      - main
    paths:
      - 'configs/base.yaml'
      - 'raspi-3b64-tinyai.yaml'
      - '.github/workflows/build.yml'

  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建Release'
        required: true
        type: choice
        default: 'yes'
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        android: true

    - name: Restore Yocto downloads
      uses: actions/cache/restore@v4
      with:
        path: build/downloads
        key: yocto-downloads-v2-${{ runner.os }}
        restore-keys: |
          yocto-downloads-v2-${{ runner.os }}
          yocto-downloads-v1-${{ runner.os }}

    - name: Restore Yocto sstate
      uses: actions/cache/restore@v4
      with:
        path: build/sstate-cache
        key: yocto-sstate-tinyai-v2-${{ runner.os }}
        restore-keys: |
          yocto-sstate-tinyai-v2-${{ runner.os }}
          yocto-sstate-tinyai-v1-${{ runner.os }}

    - name: Ensure build directory exists
      run: mkdir -p build/downloads build/sstate-cache

    - name: Enable user namespaces
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        echo "kernel.apparmor_restrict_unprivileged_userns=0" | sudo tee /etc/sysctl.d/99-userns.conf

    - name: Install kas and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chrpath diffstat python3-websockets
        pip install kas==5.2

    - name: Build TinyAI image
      timeout-minutes: 330
      run: kas build raspi-3b64-tinyai.yaml

    - name: Save Yocto downloads
      if: always()
      uses: actions/cache/save@v4
      with:
        path: build/downloads
        key: yocto-downloads-v2-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}

    - name: Save Yocto sstate
      if: always()
      uses: actions/cache/save@v4
      with:
        path: build/sstate-cache
        key: yocto-sstate-tinyai-v2-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/tmp/deploy/images/
        retention-days: 7

    - name: Upload ipk repo (for gh-pages opkg feed)
      uses: actions/upload-artifact@v4
      with:
        name: ipk-repo
        path: build/tmp/deploy/ipk/
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'yes')
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: artifacts

    - name: Prepare release assets
      id: prepare
      run: |
        mkdir -p release-assets

        # 根文件系统镜像（匹配所有 rpi-sdimg、ext4、tar.gz）
        find artifacts -type f \( -name "*.rpi-sdimg" -o -name "*.ext4" -o -name "*.tar.gz" \) \
          | grep -v '\-[0-9]\{8\}' \
          | while read f; do cp "$f" release-assets/$(basename "$f"); done

        # 内核镜像
        find artifacts -type f \( -name "Image" -o -name "Image.gz" \) \
          | grep -v '\-[0-9]\{8\}' \
          | while read f; do cp "$f" release-assets/$(basename "$f"); done

        # 设备树（去重：排除带 -raspberrypi3-64 后缀的 symlink）
        find artifacts -type f -name "*.dtb" \
          | grep -v '\-[0-9]\{8\}' \
          | grep -E 'bcm2710-rpi' \
          | grep -v 'rpi-2-b' \
          | grep 'raspberrypi3-64' \
          | grep -v '\-raspberrypi3-64\.dtb$' \
          | while read f; do cp "$f" release-assets/$(basename "$f"); done

        # dtbo（去重）
        find artifacts -type f -name "*.dtbo" \
          | grep -v '\-[0-9]\{8\}' \
          | grep -E '(disable-bt|miniuart-bt|pi3-miniuart-bt)' \
          | grep 'raspberrypi3-64' \
          | grep -v '\-raspberrypi3-64\.dtbo$' \
          | while read f; do cp "$f" release-assets/$(basename "$f"); done

        # initramfs
        find artifacts -type f -name "*.cpio.gz" \
          | grep -v '\-[0-9]\{8\}' \
          | while read f; do cp "$f" release-assets/$(basename "$f"); done

        echo "asset_count=$(ls -1 release-assets/ 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

    - name: Create release tag
      id: tag
      run: |
        timestamp=$(date +%Y%m%d-%H%M%S)
        echo "tag=tinyai-${timestamp}" >> $GITHUB_OUTPUT

    - name: Create Git tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag "${{ steps.tag.outputs.tag }}"
        git push origin "${{ steps.tag.outputs.tag }}"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Release TinyAI - ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
        fail_on_unmatched_files: false
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-ipk-repo:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'yes')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download ipk artifacts
      uses: actions/download-artifact@v4
      with:
        name: ipk-repo
        path: /tmp/ipk-repo

    - name: Prepare Pages content
      run: |
        set -e
        mkdir -p /tmp/gh-pages-content/ipk

        # Filter: only runtime model ipk (no -dbg/-dev/-src variants)
        for arch_dir in /tmp/ipk-repo/*/; do
          arch=$(basename "$arch_dir")
          [ "$arch" = "*" ] && continue
          mkdir -p "/tmp/gh-pages-content/ipk/$arch"

          # Copy only tinyai-model-qwen runtime ipk
          find "$arch_dir" -maxdepth 1 -type f -name "tinyai-model-qwen_*.ipk" \
            ! -name "*-dbg_*" ! -name "*-dev_*" ! -name "*-src_*" \
            -exec cp {} "/tmp/gh-pages-content/ipk/$arch/" \; 2>/dev/null || true

          # Regenerate Packages.gz from filtered ipk files
          cd "/tmp/gh-pages-content/ipk/$arch"
          if ls *.ipk 2>/dev/null; then
            (
              for ipk_file in *.ipk; do
                ar p "$ipk_file" control.tar.gz | tar -xzO ./control
                echo "Filename: $ipk_file"
                echo ""
              done
            ) | gzip > Packages.gz
          fi
          cd /tmp
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: /tmp/gh-pages-content

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
