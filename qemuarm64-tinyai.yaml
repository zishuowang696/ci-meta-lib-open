header:
  version: 8
  includes:
    - configs/base.yaml

machine: qemuarm64
distro: tinyai
target:
  - tinyai-core-image-base
  - tinyai-model-qwen

local_conf_header:
  # OpenRC 初始化系统（覆盖 distro 的 sysvinit）
  init-system: |
    INIT_MANAGER = "openrc"

  # 一键 demo 脚本
  tinyai-demo: |
    IMAGE_INSTALL:append = " tinyai-demo"

  # QEMU 镜像格式（移除 base.yaml 中继承的 rpi-sdimg）
  qemu-fstypes: |
    IMAGE_FSTYPES:remove = "rpi-sdimg"

  # initramfs 配置
  initramfs-config: |
    INITRAMFS_IMAGE = "core-image-minimal-initramfs"
    INITRAMFS_IMAGE_BUNDLE = "0"
    IMAGE_FSTYPES:pn-core-image-minimal-initramfs = "cpio.gz"
